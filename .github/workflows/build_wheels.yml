name: Build and Release Wheels

# 工作流触发条件
on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  # 1. 编译各平台的 Wheel 安装包
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Windows: 安装 MinGW + zlib
      - name: Set up MinGW and zlib (Windows only)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-zlib

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build cibuildwheel==2.21.3

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          # 跳过不常用架构
          CIBW_SKIP: "*_i686 *_s390x *_ppc64le"
          
          # Linux: 安装 zlib
          CIBW_BEFORE_ALL_LINUX: "yum install -y zlib-devel || apk add zlib-dev || apt-get install -y zlib1g-dev"
          
          # Windows: 设置 distutils 使用 MinGW
          CIBW_BEFORE_BUILD_WINDOWS: |
            pip install setuptools
            echo [build] > %PYTHON_PREFIX%\Lib\distutils\distutils.cfg
            echo compiler=mingw32 >> %PYTHON_PREFIX%\Lib\distutils\distutils.cfg
          
          # Windows 环境变量，指向 MinGW + zlib
          CIBW_ENVIRONMENT_WINDOWS: >-
            PATH="C:\msys64\mingw64\bin;$PATH"
            CC=gcc
            CXX=g++
            CPATH="C:\msys64\mingw64\include"
            LIBRARY_PATH="C:\msys64\mingw64\lib"

          # 使用 build 前端
          CIBW_BUILD_FRONTEND: "build"

          # 禁用自动测试
          CIBW_TEST_COMMAND: ""

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  # 2. 编译源码分发包 (sdist)
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  # 3. 发布到 GitHub Releases
  upload_releases:
    name: Upload to GitHub Releases
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: cibw-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          body_path: README_CN.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}