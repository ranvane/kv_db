name: Build and Release Wheels

# 工作流触发条件
on:
  push:
    branches: [ main ]      # 推送到 main 分支时触发
    tags:
      - 'v*'                # 推送版本标签（如 v1.0.0）时触发
  pull_request:
    branches: [ main ]      # 针对 main 分支的 PR 时触发

# 设置权限，允许创建 Release 和上传附件
permissions:
  contents: write

jobs:
  # 1. 编译各平台的 Wheel 安装包
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # 在 Linux, Windows, macOS 三个操作系统上并行运行
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # 使用 Python 3.11+ 运行工作流，支持最新版本的 cibuildwheel
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Windows 下通过 vcpkg 安装 zlib
      - name: Install zlib (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install zlib:x64-windows
          # 将 vcpkg 安装路径添加到系统环境变量，以便 setup.py 能够找到 zlib.lib 和 zlib.h
          echo "INCLUDE=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\include" >> $GITHUB_ENV
          echo "LIB=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build cibuildwheel==2.21.3

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          # CIBW 配置说明：
          # 1. 忽略不常用的架构，只构建主流 64 位版本，加快构建速度
          CIBW_SKIP: "*-win32 *_i686 *_s390x *_ppc64le"
          
          # 2. Linux 下安装 zlib 依赖
          CIBW_BEFORE_ALL_LINUX: "yum install -y zlib-devel || apk add zlib-dev || apt-get install -y zlib1g-dev"
          
          # 3. Windows 下确保编译环境能找到 zlib
          # cibuildwheel 默认不完全继承系统环境变量，需显式传递
          CIBW_ENVIRONMENT_WINDOWS: "INCLUDE='$VCPKG_INSTALLATION_ROOT\\installed\\x64-windows\\include' LIB='$VCPKG_INSTALLATION_ROOT\\installed\\x64-windows\\lib'"

      # 上传构建好的 .whl 文件作为临时产物
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  # 2. 编译源码分发包 (sdist)
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  # 3. 发布到 GitHub Releases
  # 仅在推送 tag (v*) 时触发发布逻辑
  upload_releases:
    name: Upload to GitHub Releases
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4

      # 下载所有之前步骤上传的产物
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: cibw-*
          merge-multiple: true

      # 创建并发布 Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          body_path: README_CN.md  # 使用中文 README 作为 Release 说明
          draft: false
          prerelease: false
          generate_release_notes: true # 自动生成变更日志
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
